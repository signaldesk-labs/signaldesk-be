services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: "mysql://app:app@localhost:3306/app"
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: app
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["3306:3306"]
